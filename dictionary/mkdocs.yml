# Version: 2025-12-06 Europe/Berlin
# Konfiguration für Staubpfoten-Doku (MkDocs + Material)

# Projektinformationen
site_name: "Staubpfoten"                        # Titel oben links
site_description: "Das Rollenspiel auf dem Mars"  # Untertitel / Meta
site_author: "hoochicken"                      # Autor:in / Maintainer
site_url: "http://127.0.0.1:8000"              # Lokale URL (für GitHub Pages später anpassen)
copyright: "© 2026 Mareike Riegel <a href='/impressum/'>Impressum und Datenschutz</a>"

# Repository-Infos (GitHub-Button oben rechts)
repo_name: "hoochicken/staubpfoten"            # Text des GitHub-Links
repo_url: "https://github.com/hoochicken/staubpfoten"  # Repo-URL
# Edit-Button: zeigt auf dictionary/documentation/...
edit_uri: "edit/main/dictionary/documentation/"

# Dokumentationsverzeichnis relativ zur mkdocs.yml (liegt in dictionary/)
docs_dir: "documentation"

# Theme (Layout)
theme:
  name: "material"                             # Material-Theme
  custom_dir: overrides   # NEU: Ordner für Overrides
  language: "de"                               # UI-Sprache Deutsch

  # KEINE Top-Navigation, KEINE Tabs:
  # Wenn du nur die Seitenleiste links willst, lässt du features leer oder weg.
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate

  # Tastaturkürzel
  shortcuts:
    help: 191                                  # ? -> Hilfe
    next: 78                                   # n -> Nächste Seite
    previous: 80                               # p -> Vorherige Seite
    search: 83                                 # s -> Suche

  # Farbpaletten (mit Toggle zwischen dunkel/hell)
  palette:
    # Standard: dunkles Design
    - scheme: slate                         # Dunkles Farbschema
      primary: custom                       # nutzt eigene Primärfarbe (Marsrot)
      accent: custom                        # nutzt eigene Akzentfarbe
      toggle:
        icon: material/brightness-7         # Sonnensymbol
        name: "In helles Design wechseln"   # Tooltip / Screenreader-Text

    # Zweite Palette: helles Design
    - scheme: default                       # Helles Farbschema
      primary: custom                       # nutzt eigene Primärfarbe (Marsrot)
      accent: custom                        # nutzt eigene Akzentfarbe
      toggle:
        icon: material/brightness-4         # Mondsymbol
        name: "In dunkles Design wechseln"  # Tooltip / Screenreader-Text

# Plugins
plugins:
  - search:
      separator: '[\s\-\.]+'                   # Worttrennung für Suche
      lang:
        - de                                   # Suchindex auf Deutsch

# Markdown-Erweiterungen
markdown_extensions:
  - markdown_include.include:                  # Andere .md-Dateien einbinden
      base_path: documentation
  - attr_list                                  # Attribute im Markdown ({ })

# Eigene CSS-Datei
extra_css:
  - "assets/css/custom.css"                    # Pfad relativ zu docs_dir

# Navigation
nav:
  - Startseite: index.md
  - archive:
    - "🧑‍🚀 Schnellstarter": _archive-ichbinnand/rules/schnellstarter.md

    - "🧑‍🚀 Regeln":
      - Charaktererstellung: _archive-ichbinnand/rules/charaktererstellung.md
      - Charakterbögen: _archive-ichbinnand/rules/charakterboegen.md
      - Regeln: _archive-ichbinnand/rules/regeln.md

    - "🪖 Kadettschaft":
      - Allgemeine Infos: _archive-ichbinnand/kadettschaft/allgemein.md
      - Rangabzeichen: _archive-ichbinnand/kadettschaft/rangabzeichen.md

    - "🌍 Welt":
      - Geograhie:
        - Mars: _archive-ichbinnand/welt/mars.md
        - Bromsal: _archive-ichbinnand/welt/bromsal.md
        - Zeitlinien: _archive-ichbinnand/welt/timeline.md
        - Sonnensystem: _archive-ichbinnand/welt/sonnensystem.md
        - Quantenraum: _archive-ichbinnand/welt/quantenraum.md
        - Karten: _archive-ichbinnand/welt/karten.md
      - "👽 Kräfte & Völker":
          - Völkerübersicht: _archive-ichbinnand/kraefte/voelker.md
          - KI: _archive-ichbinnand/kraefte/ki.md
          - AKI: _archive-ichbinnand/kraefte/aki.md
          - Brom: _archive-ichbinnand/kraefte/brom.md
          - Gott: _archive-ichbinnand/kraefte/gott.md
          - Raummolche: _archive-ichbinnand/kraefte/raummolche.md
      - "🛠️ Ausrüstung":
        - Übersicht: _archive-ichbinnand/ausruestung/index.md
        - Geraffel: _archive-ichbinnand/ausruestung/geraffel.md
        - Anzüge: _archive-ichbinnand/ausruestung/anzuege.md
        - Helme: _archive-ichbinnand/ausruestung/helme.md
        - Leichtatmer & Handschuhe: _archive-ichbinnand/ausruestung/leichtatmer-und-handschuhe.md
      - "⚙️ Technik":
          - "Kommunikation & Medizin":
            - Kommunikation: _archive-ichbinnand/technik/kommunikation.md
            - Medizin: _archive-ichbinnand/technik/medizin.md
          - "Fahrzeuge & Waffen":
            - Vehikel: _archive-ichbinnand/technik/vehikel.md
            - Waffen:
              - Granaten: _archive-ichbinnand/technik/waffen/granaten.md
      - "🧑‍🌾 Kultur & Alltag":
        - Marser: _archive-ichbinnand/kultur/marser.md
        - Hobbys: _archive-ichbinnand/kultur/hobbys.md
        - Kommunikation: _archive-ichbinnand/kultur/kommunikation.md

    - "🎲 Abenteuer":
      - Hauptkampagne:
        - Wehrerziehungslager: _archive-ichbinnand/abenteuer/01-wehrerziehungslager.md
        - Der erste Auftrag: _archive-ichbinnand/abenteuer/02-erster-auftrag.md
        - Stimme aus der Stille: _archive-ichbinnand/abenteuer/03-stimme-aus-der-stille.md
      - Solo-RPG:
        - Mini-RPG: _archive-ichbinnand/abenteuer/99-mini-rpg.md
      - NPC-Datenbank:
        - Wehrerziehungslager: _archive-ichbinnand/npc/wehrerziehungslager.md
