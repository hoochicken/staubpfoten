<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Fit wie ein Kadett einbetten</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f5f0;color:#1d2216}
  .page{max-width:900px;margin:0 auto;padding:24px 16px}
  h1{font-size:24px}
  p{line-height:1.6}
  /* Der Rahmen fuer die App: feste Breite, Hoehe passt sich dem Bildschirm an */
  .kadett-frame{
    width:100%;
    max-width:440px;
    height:min(860px, 90vh);
    border:0;
    border-radius:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
    display:block;
    margin:24px auto;
    background:#12160F;
  }
</style>
</head>
<body>
<div class="page">
  <h1>Kadetten-Training</h1>
  <p>Hier kommt der Text deiner Website hin. Darunter laeuft die App direkt in der Seite.</p>

  <!-- ===== Das hier in deine Website einfuegen ===== -->
  <iframe
    class="kadett-frame"
    src="fit-wie-ein-kadett.html"
    title="Fit wie ein Kadett"
    allow="fullscreen"
    loading="lazy"></iframe>
  <!-- ===== Ende ===== -->

  <p>
    Wichtig: Die Datei <code>fit-wie-ein-kadett.html</code> muss im selben Ordner
    (oder unter der im <code>src</code> angegebenen Adresse) auf deinem Webserver liegen.
  </p>
</div>
</body>
</html>
